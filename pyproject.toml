[project]
name = "llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43.126",
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "hnswlib>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
