name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-runtime.txt -r requirements-build.txt pytest httpx
      - run: python -m pytest -q

  docker-build:   # validates the Dockerfile end to end: downloads the papers, builds the index, warms the models
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: paper-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
